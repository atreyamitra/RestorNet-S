name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy opencv-python-headless scikit-image Pillow tqdm pytest
      - name: Tests
        run: python -m pytest -q
      - name: Benchmark (CPU, 50 synthetic images)
        run: python scripts/benchmark.py --out-dir "$RUNNER_TEMP/bm"
